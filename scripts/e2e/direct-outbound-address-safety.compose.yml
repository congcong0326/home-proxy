services:
  control-manager:
    image: ${E2E_CONTROL_IMAGE}
    environment:
      SERVER_PORT: 8443
      HOME_PROXY_DATA_DIR: /data
      SPRING_APPLICATION_JSON: '{"observability":{"flushMaxDelayMs":1000}}'
      ADMIN_AUTH_JWT_SECRET: ${E2E_JWT_SECRET}
    ports:
      - "127.0.0.1:${E2E_CONTROL_PORT}:8443"
    extra_hosts:
      - "home-proxy-control-manager:host-gateway"
    networks: [control]

networks:
  control:
