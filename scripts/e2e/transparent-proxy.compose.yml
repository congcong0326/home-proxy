services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${E2E_MYSQL_PASSWORD}
      MYSQL_DATABASE: tpproxy
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 2s
      timeout: 2s
      retries: 45
    networks: [control]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${E2E_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host 127.0.0.1 --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 45
    networks: [control]

  control-manager:
    image: ${E2E_CONTROL_IMAGE}
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      SERVER_PORT: 8443
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tpproxy?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${E2E_MYSQL_PASSWORD}
      CLICKHOUSE_URL: jdbc:ch://clickhouse:8123/default
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ${E2E_CLICKHOUSE_PASSWORD}
      LOGS_PERSISTENCE: clickhouse
      SPRING_APPLICATION_JSON: '{"logs":{"clickhouse":{"maxDelayMs":1000}}}'
      ADMIN_AUTH_JWT_SECRET: ${E2E_JWT_SECRET}
      WORKER_AUTH_LEGACY_ENABLED: "false"
    ports:
      - "127.0.0.1:${E2E_CONTROL_PORT}:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "home-proxy-control-manager:host-gateway"
    networks: [control]

networks:
  control:
