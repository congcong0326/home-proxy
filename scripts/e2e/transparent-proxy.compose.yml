services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${E2E_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host 127.0.0.1 --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 45
    networks: [control]

  control-manager:
    image: ${E2E_CONTROL_IMAGE}
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SERVER_PORT: 8443
      HOME_PROXY_DATA_DIR: /data
      CLICKHOUSE_URL: jdbc:ch://clickhouse:8123/default
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ${E2E_CLICKHOUSE_PASSWORD}
      LOGS_PERSISTENCE: clickhouse
      SPRING_APPLICATION_JSON: '{"logs":{"clickhouse":{"maxDelayMs":1000}},"observability":{"flushMaxDelayMs":1000}}'
      ADMIN_AUTH_JWT_SECRET: ${E2E_JWT_SECRET}
    ports:
      - "127.0.0.1:${E2E_CONTROL_PORT}:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "home-proxy-control-manager:host-gateway"
    networks: [control]

networks:
  control:
