# Test configuration: every test run gets a throwaway SQLite file; no external database is required.
spring.application.name=control-manager-test

spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/home-proxy-test-${random.uuid}/home-proxy.db
home-proxy.backup.enabled=false

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

admin.auth.jwt.secret=test_secret_key_for_testing_only_do_not_use_in_production
admin.auth.jwt.ttlDays=1
admin.auth.jwt.issuer=nasproxy-management-test
admin.auth.cookie.enabled=false
admin.auth.cookie.name=Admin-Session-Test
admin.auth.cookie.secure=false
admin.auth.login.rateLimitPerMinute=10

logging.level.org.congcong=DEBUG
