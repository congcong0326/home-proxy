spring.application.name=control-manager
# SQLite metadata database (WAL/foreign keys/busy timeout are applied per connection in DataSourceConfig)
spring.datasource.url=jdbc:sqlite:${HOME_PROXY_DATA_DIR:./data}/home-proxy.db
home-proxy.sqlite.busy-timeout-ms=10000
home-proxy.sqlite.pool-size=4
# Online backups (VACUUM INTO) kept in <data dir>/backups unless home-proxy.backup.dir is set
home-proxy.backup.enabled=true
home-proxy.backup.cron=0 30 3 * * *
home-proxy.backup.retention=7
server.port=8443
server.address=0.0.0.0
# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
admin.auth.jwt.secret=f3c95a6a218a58ec0fde5a0b85466339a6a466279663b69f5daf69d6e036f4ab8a6b00d009e3bd6698f815aee07b5560
admin.auth.jwt.ttlDays=30
admin.auth.jwt.issuer=nasproxy-management
admin.auth.cookie.enabled=false
admin.auth.cookie.name=Admin-Session
admin.auth.cookie.secure=true
admin.auth.login.rateLimitPerMinute=5

# New telemetry ingestion and queries are enabled by default; environment variables can disable them.
# Telemetry facts (sessions / DNS / failed auth) are kept in a separate SQLite file next to the metadata database
observability.sqlite.url=jdbc:sqlite:${HOME_PROXY_DATA_DIR:./data}/telemetry.db
observability.sqlite.busy-timeout-ms=10000
observability.sqlite.pool-size=4
observability.ingest-enabled=true
observability.query-enabled=true
observability.flush-batch-size=1000
observability.flush-max-delay-ms=120000
observability.flush-check-ms=1000
observability.buffer-capacity=20000
observability.buffer-max-bytes=67108864
# Retain 90 UTC calendar days including today; cap combined sessions/DNS/auth at 100 million.
# On overflow remove the oldest whole day across all tables until both limits are met.
observability.retention-days=90
observability.max-records=100000000
observability.retention-check-ms=3600000
observability.retention-initial-delay-ms=60000

disk.monitor.push-token=
disk.monitor.retention-days=7
