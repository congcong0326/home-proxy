# 代理工作节点配置文件
# 配置与日志均由控制端经 WSS 管理通道推送/拉取，Worker 不再主动访问控制端 HTTP 接口。

worker.id=default
worker.lastKnownGoodConfig=/data/proxy-worker/last-known-good-config.json

# Controller-initiated WSS management channel. The worker polls configuration
# through this channel and validates the controller's bearer token.
# Bind address of the management port; 0.0.0.0 listens on all interfaces.
worker.management.host=0.0.0.0
worker.management.port=18444
# Fixed token (hpw_ prefix) via WORKER_MANAGEMENT_TOKEN takes precedence and is never written to disk;
# otherwise the token is generated once into tokenFile and reused.
worker.management.tokenFile=/data/proxy-worker/management.token
worker.management.pollIntervalMs=2000

# 入站 TLS 证书（可选）。证书与私钥都留空时，worker 首次启动在 tls.selfSignedDir 生成自签证书并持久化复用；
# 配置了外部证书则必须可读，否则 TLS 入站启动失败，不回退自签。
tls.certFile=
tls.keyFile=
# If the private key is encrypted, mount its password as a file; never put it in this file.
tls.keyPasswordFile=
tls.selfSignedDir=/data/proxy-worker/tls
