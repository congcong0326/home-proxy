name: home-proxy-worker

services:
  proxy-worker:
    image: home-proxy-worker:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.proxy-worker
    container_name: home-proxy-worker-${WORKER_ID:-default}
    restart: unless-stopped
    network_mode: host
    environment:
      # Every worker needs its own ID; it must match the node created in the management console.
      WORKER_ID: ${WORKER_ID:-default}
      # Host network: the management WSS listens on the host directly, compose "ports" does not apply.
      # Bind to a LAN/VPN address to keep it off the public interface.
      WORKER_MANAGEMENT_HOST: ${WORKER_MANAGEMENT_HOST:-0.0.0.0}
      WORKER_MANAGEMENT_PORT: ${WORKER_MANAGEMENT_PORT:-18444}
      # Optional fixed management token (hpw_ prefix). Empty: generated once into the data volume and reused.
      WORKER_MANAGEMENT_TOKEN: ${WORKER_MANAGEMENT_TOKEN:-}
      # Size the heap and direct memory for the host; OOM flags are fixed in the image.
      JAVA_OPTS: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
    volumes:
      # Generated management token, last-known-good config and inbound TLS self-signed certificate.
      - proxy-worker-data:/data/proxy-worker
    logging:
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  proxy-worker-data:
