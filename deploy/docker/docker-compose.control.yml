name: home-proxy-control

services:
  control-manager:
    image: home-proxy-control-manager:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-manager
    container_name: home-proxy-control-manager
    restart: unless-stopped
    # Keep -Xmx in step with mem_limit: heap + metaspace/code cache/threads/direct memory must fit the limit.
    mem_limit: 1536m
    environment:
      JAVA_OPTS: "-Xmx896m -XX:+UseG1GC -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError"
    ports:
      # Restrict to a LAN address, e.g. "192.168.1.10:18443:8443", when the host has multiple networks.
      - "0.0.0.0:18443:8443"
    volumes:
      # SQLite metadata database, telemetry database and backups.
      - control-data:/data

volumes:
  control-data:
