name: home-proxy-control

services:
  control-manager:
    image: home-proxy-control-manager:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-manager
    container_name: home-proxy-control-manager
    restart: unless-stopped
    environment:
      SERVER_PORT: 8443
      # Worker WSS endpoints use locally generated certificates without IP SANs.
      # Set this at JVM startup (runtime System.setProperty is too late for JDK HttpClient).
      JAVA_TOOL_OPTIONS: "-Djdk.internal.httpclient.disableHostnameVerification=true"
      HOME_PROXY_DATA_DIR: /data
      HOME_PROXY_BACKUP_ENABLED: ${HOME_PROXY_BACKUP_ENABLED:-true}
      HOME_PROXY_BACKUP_CRON: ${HOME_PROXY_BACKUP_CRON:-0 30 3 * * *}
      HOME_PROXY_BACKUP_RETENTION: ${HOME_PROXY_BACKUP_RETENTION:-7}
      OBSERVABILITY_INGEST_ENABLED: ${OBSERVABILITY_INGEST_ENABLED:-true}
      OBSERVABILITY_QUERY_ENABLED: ${OBSERVABILITY_QUERY_ENABLED:-true}
      OBSERVABILITY_FLUSH_BATCH_SIZE: ${OBSERVABILITY_FLUSH_BATCH_SIZE:-1000}
      OBSERVABILITY_FLUSH_MAX_DELAY_MS: ${OBSERVABILITY_FLUSH_MAX_DELAY_MS:-120000}
      OBSERVABILITY_BUFFER_CAPACITY: ${OBSERVABILITY_BUFFER_CAPACITY:-20000}
      OBSERVABILITY_BUFFER_MAX_BYTES: ${OBSERVABILITY_BUFFER_MAX_BYTES:-67108864}
      ADMIN_AUTH_JWT_SECRET: ${ADMIN_AUTH_JWT_SECRET:-dev_only_change_me_home_proxy_jwt_secret}
      DISK_MONITOR_PUSH_TOKEN: ${DISK_MONITOR_PUSH_TOKEN:-}
      DISK_MONITOR_RETENTION_DAYS: ${DISK_MONITOR_RETENTION_DAYS:-7}
      GEOIP_MMDB_PATH: ${GEOIP_MMDB_PATH:-}
      GEOIP_DATA_DIR: ${GEOIP_DATA_DIR:-}
    volumes:
      - control-data:/data
    ports:
      - "${CONTROL_BIND_ADDRESS:-0.0.0.0}:${CONTROL_HTTPS_HOST_PORT:-18443}:8443"
    networks: [home-proxy-db]

volumes:
  control-data:

networks:
  home-proxy-db:
    name: home-proxy-db
