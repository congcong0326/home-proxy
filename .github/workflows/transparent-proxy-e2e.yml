name: Transparent proxy E2E

on:
  pull_request:
    paths:
      - 'backend/common/**'
      - 'backend/control-manager/**'
      - 'backend/proxy-worker/**'
      - 'deploy/docker/**'
      - 'scripts/e2e/**'
      - 'Makefile'
      - '.github/workflows/transparent-proxy-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transparent-proxy-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run privileged transparent-proxy E2E
        run: make e2e-transparent
